[package]
name = "scanner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.dev]
debug = true

[[bin]]
name = "scanner"
path = "bin/scanner.rs"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "band_scanning_test"
path = "tests/band_scanning_test.rs"

[[test]]
name = "frequency_detection_test"
path = "tests/frequency_detection_test.rs"

[[test]]
name = "shutdown_test"
path = "tests/shutdown_test.rs"

[[test]]
name = "loom_shutdown_test"
path = "tests/loom_shutdown_test.rs"

[[bench]]
name = "peak_detection_bench"
harness = false

[features]
default = ["soapysdr"]
soapysdr = []
seify = []
rtlsdr = []

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
cpal = "0.15"
log = "0.4.27"
phf = { version = "0.11", features = ["macros"] }
rustfft = "6.4.0"
rustradio = { git = "https://github.com/ThomasHabets/rustradio.git", branch = "main", features = ["soapysdr", "fast-math", "simd"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
soapysdr = "0.4.2"
soapysdr-sys = "0.7.5"
stderrlog = "0.6.0"
thiserror = "1.0"
tracing = "0.1.40"
tracing-log = "0.2.0" # To bridge log macros to tracing
tracing-subscriber = { version = "0.3.17", features = ["json"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
dashmap = "6.1"
smartcore = "0.4.2"
num = { version = "0.4", features = ["serde"] }
hound = "3.5"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8.5"
ratatui = "0.28"
crossterm = "0.28"
signal-hook = "0.3"
ctrlc = "3.4"
thread-priority = "1.2"
libc = "0.2"
postcard = { version = "1.0", features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9"
nix = { version = "0.29", features = ["poll"] }

[dev-dependencies]
rand = "0.8.5"
glob = "0.3"
tempfile = "3.13"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
proptest-state-machine = "0.4"
loom = "0.7"

[[bench]]
name = "serialization_bench"
path = "benches/ipc/serialization_bench.rs"
harness = false

[[bench]]
name = "latency_bench"
path = "benches/ipc/latency_bench.rs"
harness = false

[[bench]]
name = "throughput_bench"
path = "benches/ipc/throughput_bench.rs"
harness = false
